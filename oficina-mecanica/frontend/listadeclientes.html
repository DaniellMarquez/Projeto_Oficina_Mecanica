<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">

    <h1 class="mb-4">Lista de Clientes</h1>

    <div class="row g-2 mb-3">
        <div class="col-md-3">
            <select id="campoFiltro" class="form-select" aria-label="Filtrar por">
                <option value="nome">Nome</option>
                <option value="cpf">CPF</option>
                <option value="email">E-mail</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" id="textoFiltro" class="form-control" placeholder="Digite para filtrar...">
        </div>
        <div class="col-md-3">
            <button type="button" id="btnLimparFiltro" class="btn btn-outline-secondary w-100">
                Limpar filtro
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaClientes">
            </tbody>
        </table>
    </div>

    <a href="/cadastro-de-cliente" class="btn btn-link">
        Cadastrar Novo Cliente
    </a>

    <a href="/" class="btn btn-link">
        Voltar ao início
    </a>

    <script src="/frontend/js/cliente.js?v=1"></script>

</body>

</html>
