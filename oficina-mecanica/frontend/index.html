<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="mb-1">Oficina Mecânica</h1>
        <p class="text-muted mb-4">Sistema de gestão da oficina</p>

        <div class="row g-3">

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5">Clientes</h2>
                        <p class="text-muted">Cadastre, consulte, altere e exclua clientes.</p>
                        <a href="/lista-de-clientes" class="btn btn-dark btn-sm">Ver lista</a>
                        <a href="/cadastro-de-cliente" class="btn btn-outline-dark btn-sm">Cadastrar</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100 opacity-50">
                    <div class="card-body">
                        <h2 class="h5">Veículos</h2>
                        <p class="text-muted mb-0">Em breve.</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100 opacity-50">
                    <div class="card-body">
                        <h2 class="h5">Ordens de serviço</h2>
                        <p class="text-muted mb-0">Em breve.</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
