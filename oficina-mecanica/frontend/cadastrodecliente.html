<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white py-3">
                        <h1 class="h4 mb-0 fw-bold">
                            <i class="bi bi-person-fill me-2"></i><span id="tituloFormulario">Cadastro de Cliente</span>
                        </h1>
                    </div>

                    <div class="card-body p-4">
                        <form id="form-cliente">

                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input type="text" id="nome" name="nome" class="form-control"
                                    placeholder="Ex: Maria da Silva" required>
                            </div>

                            <div class="mb-3">
                                <label for="cpf" class="form-label">CPF</label>
                                <input type="text" id="cpf" name="cpf" class="form-control"
                                    placeholder="000.000.000-00" maxlength="14" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-control"
                                    placeholder="cliente@email.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="senha" id="labelSenha" class="form-label">Senha</label>
                                <input type="password" id="senha" name="senha" class="form-control"
                                    placeholder="Mínimo de 6 caracteres" minlength="6" maxlength="50"
                                    autocomplete="new-password" required>
                            </div>

                            <button type="submit" id="btnSalvar" class="btn btn-dark w-100 py-2 fw-bold">
                                Cadastrar Cliente
                            </button>

                        </form>

                        <div id="mensagem" class="mt-3" aria-live="polite"></div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="/lista-de-clientes" class="btn btn-link link-secondary">
                        <i class="bi bi-list-ul me-1"></i> Ver lista de clientes
                    </a>
                    <span class="text-muted">|</span>
                    <a href="/" class="btn btn-link link-secondary">
                        <i class="bi bi-house-door-fill me-1"></i> Voltar para o início
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="/frontend/js/cliente.js?v=1"></script>
</body>

</html>
